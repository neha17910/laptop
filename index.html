<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laptop Store</title>
<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff}
header{background:#475569;padding:15px 25px}
.hero{padding:90px;text-align:center;background:linear-gradient(#0006,#000b),url("https://images.unsplash.com/photo-1496181133206-80ce9b88a853") center/cover}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:40px}
.card{background:#020617;border:1px solid #1f2937;padding:15px;border-radius:10px}
.card img{width:100%;height:200px;object-fit:cover;border-radius:8px}
footer{text-align:center;padding:20px;background:#000}
</style></head>
<body>
<header>💻 Laptop Store</header>
<section class="hero"><h1>Power Machines</h1></section>
<div class="grid">
<div class="card"><img src="https://images.unsplash.com/photo-1484788984921-03950022c9ef"><h3>Gaming</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8"><h3>Office</h3></div>
<div class="card"><img src="https://images.unsplash.com/photo-1517430816045-df4b7de11d1d"><h3>Ultra</h3></div>
</div>
<footer>© Laptop Store</footer>
</body></html>
